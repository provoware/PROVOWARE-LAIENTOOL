name: repo-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Validate repository contracts
        run: python3 scripts/repo_quality.py
      - name: Validate triggered info-text impact
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin "$GITHUB_BASE_REF"
            BASE_SHA="$(git merge-base HEAD "origin/$GITHUB_BASE_REF")"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          python3 scripts/info_text_guard.py --base "$BASE_SHA"
      - name: Enforce read-only product lock
        run: python3 scripts/read_only_guard.py
      - name: Run full unit and integration suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Run temporary-filesystem core diagnostic
        run: python3 scripts/core_diagnostics.py
      - name: Run redacted diagnostic snapshot
        run: python3 scripts/diagnostic_snapshot.py --json
      - name: Run read-only preflight
        run: python3 start.py
      - name: Run read-only preflight JSON
        run: python3 start.py --json
