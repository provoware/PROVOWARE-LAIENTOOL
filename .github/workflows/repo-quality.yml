name: repo-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate repository contracts
        run: python3 scripts/repo_quality.py
      - name: Run B01-A unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Run read-only preflight
        run: python3 start.py
      - name: Run read-only preflight JSON
        run: python3 start.py --json
